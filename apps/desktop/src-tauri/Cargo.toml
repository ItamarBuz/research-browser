[package]
name = "research-browser"
version = "0.1.0"
description = "Local-first academic research browser"
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (Tauri v2 convention).
name = "research_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
