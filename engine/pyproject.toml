[project]
name = "rb-engine"
version = "0.1.0"
description = "Local-first academic research engine for Research Browser"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "psutil>=6.1",
    "httpx>=0.28",
    "platformdirs>=4.3",
    "pypdfium2>=5.14.0",
    "lancedb>=0.40.0",
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "defusedxml>=0.7.1",
    "sentencepiece>=0.2.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "anyio>=4.6",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-defusedxml>=0.7.0.20260504",
    "types-psutil>=6.1",
]

[project.scripts]
rb-engine = "rb_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rb_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "PT", "RET", "TRY", "PL"]
# RUF001-003 flag Hebrew letters as "confusable" with Latin ones; Hebrew text is intended here.
# SIM905: "a b c".split() reads better than long list literals for word lists.
ignore = ["TRY003", "PLR2004", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.pylint]
max-args = 10  # composition roots take keyword-only overrides for tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["rb_engine"]

[[tool.mypy.overrides]]
# These libraries ship without type information.
module = ["pypdfium2", "onnxruntime", "pyarrow"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
