# Local AI models the engine can download.
#
# Edit this file by hand, then run `uv run python scripts/pin_models.py` to record the exact
# revision, sizes and SHA-256 hashes in models.lock.json. The engine refuses entries that
# are not pinned, and the pin tool refuses licenses outside the permissive allowlist.
#
# `tiers` lists the tiers a model is recommended for; at most one model per role per tier.
# An empty list makes the model optional (offered, but never selected automatically).
# `license_source` names the upstream repo whose license applies when `repo` is a
# conversion (e.g. ONNX exports) that does not declare one itself.

# --- Embeddings (all multilingual: Hebrew, English and cross-lingual retrieval) ---

[[models]]
id = "embed-e5-small"
name = "Multilingual E5 Small"
role = "embedder"
tiers = ["lite"]
repo = "Xenova/multilingual-e5-small"
license = "mit"
license_source = "intfloat/multilingual-e5-small"
files = ["onnx/model_quantized.onnx", "tokenizer.json", "config.json"]

[[models]]
id = "embed-e5-base"
name = "Multilingual E5 Base"
role = "embedder"
tiers = ["standard"]
repo = "Xenova/multilingual-e5-base"
license = "mit"
license_source = "intfloat/multilingual-e5-base"
files = ["onnx/model_quantized.onnx", "tokenizer.json", "config.json"]

[[models]]
id = "embed-bge-m3"
name = "BGE-M3"
role = "embedder"
tiers = ["pro"]
repo = "Xenova/bge-m3"
license = "mit"
license_source = "BAAI/bge-m3"
files = ["onnx/model_quantized.onnx", "tokenizer.json", "config.json"]

# --- Reranking (skipped on Lite to save memory) ---

[[models]]
id = "rerank-bge-v2-m3"
name = "BGE Reranker v2 M3"
role = "reranker"
tiers = ["standard", "pro"]
repo = "onnx-community/bge-reranker-v2-m3-ONNX"
license = "apache-2.0"
license_source = "BAAI/bge-reranker-v2-m3"
files = ["onnx/model_quantized.onnx", "tokenizer.json", "config.json"]

# --- Stance / natural-language inference (criticism score) ---

[[models]]
id = "nli-mdeberta-xnli"
name = "mDeBERTa v3 XNLI (multilingual)"
role = "nli"
tiers = ["lite", "standard", "pro"]
